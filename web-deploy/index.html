<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes Record - Faculty Management System | schoolcollege.online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Dashboard Grid */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            animation: fadeInUp 0.6s ease-out;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .card-emoji {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .card h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: #333;
        }

        .card p {
            color: #666;
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
        }

        .modal-content button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-btn {
            background: #666;
            margin-left: 10px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        .footer {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📚 Classes Record</h1>
        <p>Faculty Management System</p>
        <small>schoolcollege.online</small>
    </div>

    <div class="dashboard" id="dashboard">
        <!-- Cards will be loaded here -->
    </div>

    <div class="footer">
        <p>© 2024 Classes Record | Alamdar Hussain · Islamabad</p>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Login</h3>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <button onclick="handleLogin()">Login</button>
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Dashboard Cards Configuration
        const cards = [
            { emoji: "🔒", title: "My Schedules", subtitle: "Schedule · Attendance · Summary", action: "schedules", login: false },
            { emoji: "👤", title: "Faculty Sign In", subtitle: "Attendance · Exam marks", action: "faculty", login: true, role: "faculty" },
            { emoji: "🎓", title: "Student Sign In", subtitle: "Attendance · Marks · Profile", action: "student", login: true, role: "student" },
            { emoji: "💰", title: "Account & Finance", subtitle: "Fees · Salary · Payments", action: "finance", login: true, role: "admin" },
            { emoji: "🛡️", title: "Admin Panel", subtitle: "Users · Passwords · CSV", action: "admin", login: true, role: "admin" },
            { emoji: "📖", title: "Tutorial", subtitle: "Guide · Examples · PDF", action: "tutorial", login: false },
            { emoji: "📞", title: "Contact Us", subtitle: "Alamdar Hussain · Islamabad", action: "contact", login: false }
        ];

        let currentAction = null;
        let currentRole = null;

        // Load dashboard
        function loadDashboard() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = cards.map(card => `
                <div class="card" onclick="handleCardClick('${card.action}', ${card.login}, '${card.role || ''}')">
                    <div class="card-emoji">${card.emoji}</div>
                    <h3>${card.title}</h3>
                    <p>${card.subtitle}</p>
                </div>
            `).join('');
        }

        // Handle card click
        function handleCardClick(action, requiresLogin, role) {
            if (requiresLogin) {
                currentAction = action;
                currentRole = role;
                showModal(action);
            } else {
                showInfo(action);
            }
        }

        // Show modal
        function showModal(action) {
            const modal = document.getElementById('loginModal');
            const titleMap = {
                faculty: 'Faculty Login',
                student: 'Student Login',
                admin: 'Admin Login',
                finance: 'Finance Login'
            };
            document.getElementById('modalTitle').textContent = titleMap[currentRole] || 'Login';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            modal.style.display = 'flex';
        }

        // Handle login
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('Please enter username and password');
                return;
            }

            // Demo credentials
            if (currentRole === 'admin' && username === 'admin' && password === 'admin123') {
                alert(`Welcome to ${currentAction} panel!\n\nThis feature is coming soon.`);
                closeModal();
            } else if (currentRole === 'student' && username === 'student' && password === 'student123') {
                alert(`Welcome Student!\n\nYour attendance and marks will appear here.`);
                closeModal();
            } else {
                alert('Invalid credentials. Demo:\nAdmin: admin/admin123\nStudent: student/student123');
            }
        }

        // Show info for non-login cards
        function showInfo(action) {
            const messages = {
                schedules: '📅 Schedule management coming soon!\n\nYou will be able to view and manage class schedules.',
                tutorial: '📖 Tutorial section coming soon!\n\nVideo guides and PDF documentation will be available.',
                contact: '📞 Contact Information:\n\nAlamdar Hussain\nIslamabad, Pakistan\nEmail: alamdar@schoolcollege.online'
            };
            alert(messages[action] || `${action} feature is coming soon!`);
        }

        // Close modal
        function closeModal() {
            document.getElementById('loginModal').style.display = 'none';
            currentAction = null;
            currentRole = null;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('loginModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initialize
        loadDashboard();
    </script>
</body>
</html>
